services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: immofilter
      POSTGRES_USER: immofilter
      POSTGRES_PASSWORD: immofilter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immofilter"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://immofilter:immofilter@postgres:5432/immofilter
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
